<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiruna Live Bus Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="app-header">
    <h1>Kiruna Live Bus Tracker</h1>
    <p id="app-error" class="banner banner-error" hidden></p>
    <p id="status-banner" class="banner banner-status" hidden></p>
  </header>

  <main class="app-layout">
    <section class="map-panel">
      <div id="map"></div>
    </section>

    <aside class="side-panel">
      <section class="filters-panel">
        <h2>Lines</h2>
        <div id="line-filters" class="line-filters"></div>
      </section>

      <section id="live-buses" class="live-buses-panel"></section>

      <section class="stop-panel">
        <h2>Stop</h2>
        <div class="stop-search">
          <input id="stop-search" type="text" placeholder="Search stop, e.g. Stadshustorget" autocomplete="off" />
          <button id="stop-clear" type="button">Clear</button>
        </div>
        <ul id="stop-search-results" class="stop-search-results"></ul>
      </section>

      <section id="arrivals" class="arrivals-panel"></section>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
